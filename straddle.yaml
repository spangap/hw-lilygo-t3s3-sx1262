# hw-lilygo-t3s3-sx1262 — board HAL straddle for the LilyGo T3-S3 (LoRa32) with SX1262.
#
# A plain (non-buildable) board component: it doesn't decide what the device
# DOES, it only makes the board usable by an app. The reticulous/reticulous
# buildable adds it with `--with spangap/hw-lilygo-t3s3-sx1262` and inherits the
# board's pin map, bring-up hook and hardware kconfig.
#
# Owns the board HAL (esp-idf/src/t3s3.cpp: the LoRa CS park). app_main,
# partitions, the OTA story and the browser SPA are NOT here — they belong to
# the buildable. Board reference:
# https://wiki.lilygo.cc/products/t3-series/t3-s3/
#
# This straddle targets the SX1262 (sub-GHz SX126x) variant of the T3-S3. The
# SX1276/SX1278 (SX127x) and SX1280 (2.4 GHz) variants wire their radios
# differently (no BUSY line, DIO0 IRQ, external RX/TX-enable, no chip TCXO) and
# want their own board straddle. First cut here is LoRa + microSD; the 0.96"
# SSD1306 OLED on the board is deliberately left unwired (the platform's on-
# device UI is colour-TFT LVGL, not a mono OLED), so this builds headless.
schema_version: 1
name: spangap/hw-lilygo-t3s3-sx1262
prefix: t3s3
firmware: esp-idf
version: 0.0.0
platforms: [idf]
# Board bring-up as a registered Service. app_main is generated by the buildable;
# it constructs T3s3Board and walks it. T3s3Board::onStart is bare-hardware
# (LoRa CS park) and runs before spangapInit(). No onInit — there is no on-device
# UI in this build.
services:
  - { class: T3s3Board, header: t3s3.h }
# Board VALUES, fed to the symbols other straddles / IDF DEFINE through the
# collected staging/sdkconfig.spangap-fragments. A board straddle is non-
# buildable, so its sdkconfig.defaults would be IGNORED — everything that
# describes this hardware MUST live here in kconfig: to survive `--with`.
kconfig:
  # Board memory: the T3-S3 is built on the ESP32-S3-WROOM-1(U) with the
  # ESP32-S3FH4R2 die — 4 MB flash, 2 MB *quad* PSRAM. Like the Heltec V4 /
  # Nibble Zero (and unlike the XIAO ESP32S3's S3R8 octal), PSRAM is QUAD, so
  # SPIRAM_MODE_QUAD not _OCT. 4 MB flash is tight for the reticulous buildable —
  # verify the module revision on your board before trusting the partition math.
  - CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y
  # State floor = the offset where the runtime read-write /state partition
  # begins; /state then fills the rest of the real 4 MB chip. WITHOUT this the
  # floor defaults to the whole flash container, so `app` expands to fill all
  # 4 MB and NO /state partition exists (the device has nowhere to store user
  # data).
  #
  # The floor is the region `app` and `fixed` (the packed browser bundle, ~704
  # KB) divide between them, and on a 4 MB chip those two are what binds: a
  # 3.75 MB floor is the least that fits the reticulous binary next to `fixed`,
  # and it leaves /state 256 KB. That is enough here because the board carries
  # a microSD slot — bulk data belongs on the card, not in /state — so the
  # flash is better spent on firmware. Changing this relocates /state →
  # existing devices factory-reset on the next boot, so warn users before
  # bumping it.
  - CONFIG_SPANGAP_MAX_FIRMWARE_KB=3840
  - CONFIG_SPIRAM_MODE_QUAD=y
  # One SX1262 LoRa modem on its own SPI bus (SPI2/FSPI), separate from both the
  # flash bus and the SD card's bus. Pins per the LilyGo T3-S3 SX1262 pin map
  # (matches Meshtastic's tlora_t3s3_v1 variant). The SX1262 drives DIO2 as its
  # own RF antenna switch and DIO3 supplies the 1.8 V TCXO.
  - CONFIG_LORA_COUNT=1
  - CONFIG_LORA_SPI_HOST=2
  - CONFIG_LORA_SCK_PIN=5
  - CONFIG_LORA_MOSI_PIN=6
  - CONFIG_LORA_MISO_PIN=3
  - CONFIG_LORA0_CS_PIN=7
  - CONFIG_LORA0_DIO1_PIN=33
  - CONFIG_LORA0_BUSY_PIN=34
  - CONFIG_LORA0_RST_PIN=8
  - CONFIG_LORA0_TCXO_MV=1800
  - CONFIG_LORA0_DIO2_RF_SWITCH=y
  - CONFIG_LORA0_RADIO_SX1262=y
  # microSD card on its OWN SPI bus (SPI3/HSPI) — the T3-S3 wires the SD slot to
  # a different pin set than the radio, so it takes a separate SPI host (not the
  # shared-bus arrangement the T-Deck uses). spangapInit() calls fs_mount_sd()
  # automatically when SDCARD=y.
  - CONFIG_SPANGAP_SDCARD=y
  - CONFIG_SPANGAP_SDCARD_BUS_SPI=y
  - CONFIG_SPANGAP_SDCARD_SPI_HOST=3
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_CS=13
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_SCK=14
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_MOSI=11
  - CONFIG_SPANGAP_SDCARD_SPI_PIN_MISO=2
